--- public/CustomerService.html (原始)


+++ public/CustomerService.html (修改后)
<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>고객센터 — FPP v2</title>
<meta name="description" content="FPP v2 고객센터 — FAQ, 1:1 문의" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<script>
(function(){try{var t=localStorage.getItem('fpp_theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/css/common.css" />
<link rel="stylesheet" href="/css/CustomerService.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body data-page="cs">

<div class="ambient" aria-hidden="true"></div>

<header id="appHeader" class="app-header"></header>
<nav id="desktopNav" class="desk-nav" aria-label="주 메뉴"></nav>

<div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
<aside class="drawer" id="navDrawer" aria-label="전체 메뉴" aria-hidden="true"></aside>

<main id="view">
  <section class="page" id="view-cs">
    <div class="banner banner--page" aria-label="고객센터 배너">
      <div class="banner-fallback banner-fallback--cs" aria-hidden="true"></div>
      <div class="banner-media" id="csBannerMedia"></div>
      <div class="banner-tag"><span class="banner-tag-txt">SUPPORT</span></div>
    </div>

    <div class="wrap cs-wrap">
      <!-- 검색 -->
      <div class="cs-search rv">
        <label class="search search--big">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="csSearch" type="search" placeholder="무엇을 도와드릴까요?  예) 캐릭터, 패치, 이벤트" aria-label="고객센터 검색" />
        </label>
      </div>

      <!-- 문의 버튼 -->
      <div class="cs-actions rv">
        <button class="cs-btn" id="btnInquiry" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <span>1:1 문의</span>
        </button>
        <button class="cs-btn" id="btnMyInquiry" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v5h5M9 12h7M9 16h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>나의 문의 보기</span>
        </button>
      </div>

      <!-- 목록/상세 (Border 없는 목록형 Box) -->
      <div class="cs-content" id="csContent"></div>
    </div>
  </section>
</main>

<footer class="app-footer">
  <div class="wrap foot-in">
    <span class="foot-logo">FPP</span>
    <p>FPP v2 — 팬 커뮤니티 · 본 사이트는 비공식 팬 프로젝트입니다.</p>
    <p class="foot-sub">데이터는 기존 Firebase 프로젝트(fighting-path-patch)에서 실시간으로 불러옵니다.</p>
  </div>
</footer>

<nav id="bottomTabs" class="bottom-tabs" aria-label="하단 메뉴"></nav>

<div id="popupRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="/js/Firebase.js"></script>
<script src="/js/common.js"></script>
<script src="/js/CustomerService.js"></script>
</body>
</html>
